name: CodeQL

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '30 4 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          # Kotlin needs an actual compile to extract from; the default "none" build-mode
          # skips build tracing entirely, silently leaving all .kt files unanalyzed even
          # though the Build step below still runs.
          build-mode: manual

      - name: Build
        run: ./gradlew build -x test --no-build-cache --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
