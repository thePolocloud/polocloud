<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PoloCloud Status</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="bg-glow" aria-hidden="true"></div>

    <main class="page">
        <header class="page-header">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                <span class="brand-name">PoloCloud</span>
            </div>
            <h1>Network Status</h1>
            <p class="subtitle" id="subtitle">Loading…</p>
        </header>

        <section class="summary" id="summary" aria-live="polite">
            <div class="stat">
                <span class="stat-value" id="stat-groups">–</span>
                <span class="stat-label">Groups online</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="stat-players">–</span>
                <span class="stat-label">Players online</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="stat-services">–</span>
                <span class="stat-label">Services running</span>
            </div>
        </section>

        <section id="groups" class="groups" aria-live="polite"></section>

        <p id="empty" class="empty" hidden>No groups are published yet.</p>
        <p id="error" class="error" hidden>Could not reach the status API.</p>

        <template id="group-card-template">
            <article class="card">
                <div class="card-top">
                    <span class="dot"></span>
                    <h2 class="name"></h2>
                    <span class="badge"></span>
                </div>
                <div class="meter" role="presentation">
                    <div class="meter-fill"></div>
                </div>
                <div class="card-stats">
                    <span class="players"></span>
                    <span class="services"></span>
                </div>
            </article>
        </template>

        <footer class="page-footer">
            <span class="live-dot" aria-hidden="true"></span>
            <span id="updated">Connecting…</span>
        </footer>
    </main>

    <script src="app.js"></script>
</body>
</html>
